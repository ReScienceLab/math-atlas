<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Atlas Social Banner</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050608;
        --fg: #f4f4f5;
        --muted: #9b9ca3;
        --line: rgba(255, 255, 255, 0.14);
        --blue: #3b82f6;
        --green: #4cc79f;
        --orange: #c47a3f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Inter",
          "Geist",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .frame {
        background:
          radial-gradient(circle at 74% 43%, rgba(59, 130, 246, 0.15), transparent 23%),
          radial-gradient(circle at 66% 80%, rgba(76, 199, 159, 0.08), transparent 28%),
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(180deg, #07080b 0%, #030405 100%);
        background-size: auto, auto, 32px 32px, 32px 32px, auto;
        height: 100vh;
        isolation: isolate;
        position: relative;
        width: 100vw;
      }

      .frame::before {
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.035), transparent 28%, transparent 72%, rgba(255, 255, 255, 0.035)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 18%, transparent 72%, rgba(0, 0, 0, 0.44));
        content: "";
        inset: 0;
        pointer-events: none;
        position: absolute;
        z-index: 4;
      }

      .topbar {
        border-bottom: 1px solid var(--line);
        display: grid;
        grid-template-columns: 390px minmax(0, 1fr) 130px 110px 190px 84px;
        height: 66px;
        position: relative;
        z-index: 5;
      }

      .brand,
      .nav,
      .stat,
      .github {
        align-items: center;
        border-right: 1px solid var(--line);
        display: flex;
      }

      .brand {
        padding-left: 26px;
      }

      .brand span {
        font-size: 23px;
        font-weight: 760;
        letter-spacing: 0;
        line-height: 1;
        text-transform: uppercase;
      }

      .nav {
        gap: 52px;
        padding-left: 48px;
      }

      .nav span,
      .stat .label,
      .legend,
      .viz-label {
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .stat {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-left: 22px;
      }

      .stat .label {
        color: #8d8e96;
        font-size: 13px;
        white-space: nowrap;
      }

      .stat .value {
        color: var(--fg);
        font-size: 19px;
        font-weight: 560;
        line-height: 1.25;
        margin-top: 5px;
      }

      .github {
        border-right: 0;
        justify-content: center;
      }

      .github svg {
        opacity: 0.6;
      }

      .content {
        display: grid;
        grid-template-columns: 51.5% 48.5%;
        height: calc(100vh - 66px);
        position: relative;
        z-index: 2;
      }

      .copy {
        padding-left: 53px;
        padding-top: 58px;
      }

      h1 {
        font-size: clamp(74px, 6.35vw, 98px);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.92;
        margin: 0;
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.16);
        text-transform: uppercase;
        white-space: nowrap;
      }

      .dek {
        color: #b7b7bc;
        font-size: clamp(22px, 1.9vw, 30px);
        font-weight: 520;
        line-height: 1.34;
        margin: 22px 0 0;
        max-width: 575px;
      }

      .legend-row {
        align-items: center;
        display: flex;
        gap: 14px;
        margin-top: 24px;
      }

      .legend {
        align-items: center;
        display: inline-flex;
        gap: 9px;
        white-space: nowrap;
      }

      .swatch {
        background: currentColor;
        box-shadow: 0 0 12px color-mix(in srgb, currentColor 42%, transparent);
        height: 9px;
        width: 9px;
      }

      .separator {
        background: var(--line);
        height: 22px;
        width: 1px;
      }

      .url {
        bottom: 16px;
        color: #63a2ff;
        font-size: clamp(19px, 1.55vw, 26px);
        font-weight: 520;
        left: 53px;
        position: absolute;
      }

      .visual {
        align-items: center;
        display: flex;
        justify-content: center;
        padding: 0 14px 0 0;
        position: relative;
      }

      .viz-shell {
        height: min(90vh, 450px);
        max-width: 100%;
        position: relative;
        transform: translate(-54px, -4px);
        width: min(53vw, 800px);
      }

      .viz-label {
        color: rgba(244, 244, 245, 0.52);
        font-size: 11px;
        left: 48px;
        position: absolute;
        top: 24px;
        z-index: 3;
      }

      #kakeya-canvas {
        display: block;
        filter: drop-shadow(0 0 18px rgba(59, 130, 246, 0.14));
        height: 100%;
        width: 100%;
      }

      @media (max-width: 1300px) {
        .topbar {
          grid-template-columns: 330px 340px 110px 95px 170px 58px;
          height: 62px;
        }

        .brand span {
          font-size: 21px;
        }

        .nav {
          gap: 28px;
          padding-left: 30px;
        }

        .nav span {
          font-size: 13px;
        }

        .copy {
          padding-left: 48px;
          padding-top: 96px;
        }

        h1 {
          font-size: clamp(74px, 7.6vw, 96px);
        }

        .dek {
          font-size: clamp(22px, 2.2vw, 27px);
          max-width: 520px;
        }

        .legend-row {
          margin-top: 44px;
        }

        .url {
          margin-top: 58px;
        }

        .visual {
          padding-right: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <header class="topbar" aria-label="Math Atlas dashboard">
        <div class="brand"><span>Math Atlas</span></div>
        <nav class="nav" aria-label="Primary">
          <span>Index</span>
          <span>Problems</span>
          <span>Summary</span>
        </nav>
        <div class="stat">
          <span class="label">Problems</span>
          <span class="value">41</span>
        </div>
        <div class="stat">
          <span class="label">Open</span>
          <span class="value">14</span>
        </div>
        <div class="stat">
          <span class="label">Recent / Fields</span>
          <span class="value">9 / 10</span>
        </div>
        <div class="github" aria-label="GitHub">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#f4f4f5" fill-rule="evenodd" aria-hidden="true">
            <path d="M12 0c6.63 0 12 5.276 12 11.79-.001 5.067-3.29 9.567-8.175 11.187-.6.118-.825-.25-.825-.56 0-.398.015-1.665.015-3.242 0-1.105-.375-1.813-.81-2.181 2.67-.295 5.475-1.297 5.475-5.822 0-1.297-.465-2.344-1.23-3.169.12-.295.54-1.503-.12-3.125 0 0-1.005-.324-3.3 1.209a11.32 11.32 0 00-3-.398c-1.02 0-2.04.133-3 .398-2.295-1.518-3.3-1.209-3.3-1.209-.66 1.622-.24 2.83-.12 3.125-.765.825-1.23 1.887-1.23 3.169 0 4.51 2.79 5.527 5.46 5.822-.345.294-.66.81-.765 1.577-.69.31-2.415.81-3.495-.973-.225-.354-.9-1.223-1.845-1.209-1.005.015-.405.56.015.781.51.28 1.095 1.327 1.23 1.666.24.663 1.02 1.93 4.035 1.385 0 .988.015 1.916.015 2.196 0 .31-.225.664-.825.56C3.303 21.374-.003 16.867 0 11.791 0 5.276 5.37 0 12 0z"></path>
          </svg>
        </div>
      </header>

      <section class="content" aria-label="Math Atlas banner">
        <div class="copy">
          <h1>Math Atlas</h1>
          <p class="dek">A curated atlas of mathematical problems, conjectures, and theorems.</p>

          <div class="legend-row" aria-label="Fields">
            <span class="legend" style="color: var(--blue)"><span class="swatch"></span><span style="color: var(--muted)">Number Theory</span></span>
            <span class="separator"></span>
            <span class="legend" style="color: var(--green)"><span class="swatch"></span><span style="color: var(--muted)">Geometry</span></span>
            <span class="separator"></span>
            <span class="legend" style="color: var(--orange)"><span class="swatch"></span><span style="color: var(--muted)">Combinatorics</span></span>
            <span class="separator"></span>
            <span class="legend" style="color: #d6d7da"><span class="swatch"></span><span style="color: var(--muted)">Analysis</span></span>
            <span class="separator"></span>
            <span class="legend"><span>And More</span></span>
          </div>

          <div class="url">https://math.rescience.com/</div>
        </div>

        <div class="visual" aria-label="Kakeya Conjecture 3D visualization">
          <div class="viz-shell">
            <div class="viz-label">Kakeya Conjecture (3D)</div>
            <canvas id="kakeya-canvas" aria-label="Three.js generated 3D Kakeya needle set"></canvas>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import * as THREE from "../../node_modules/three/build/three.module.min.js";

      const shell = document.querySelector(".viz-shell");
      const canvas = document.querySelector("#kakeya-canvas");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      });

      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
      camera.position.set(2.15, 1.45, 2.45);
      camera.lookAt(0, 0, 0.05);

      function lineMaterial(color, opacity) {
        return new THREE.LineBasicMaterial({
          color,
          opacity,
          transparent: true,
          blending: THREE.NormalBlending,
          depthWrite: false,
        });
      }

      function tubeMaterial(color, opacity) {
        return new THREE.MeshBasicMaterial({
          color,
          opacity,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
      }

      function seeded(index) {
        const value = Math.sin(index * 12.9898) * 43758.5453;
        return value - Math.floor(value);
      }

      function addLine(parent, points, color, opacity) {
        const geometry = new THREE.BufferGeometry().setFromPoints(
          points,
        );
        const line = new THREE.Line(geometry, lineMaterial(color, opacity));
        parent.add(line);
        return line;
      }

      function addRing(parent, radiusX, radiusY, rotation, color, opacity) {
        const points = [];
        for (let i = 0; i < 160; i += 1) {
          const angle = (i / 160) * Math.PI * 2;
          points.push(new THREE.Vector3(Math.cos(angle) * radiusX, Math.sin(angle) * radiusY, 0));
        }
        points.push(points[0].clone());

        const ring = addLine(parent, points, color, opacity);
        ring.rotation.set(rotation[0], rotation[1], rotation[2]);
        return ring;
      }

      function buildKakeyaScene() {
        scene.clear();
        const root = new THREE.Group();
        root.rotation.set(-0.08, -0.22, 0.04);
        scene.add(root);

        addRing(root, 0.95, 0.48, [0.18, 0.22, -0.32], 0x60a5fa, 0.18);
        addRing(root, 0.95, 0.48, [1.28, 0.16, 0.62], 0xf5f5f5, 0.08);
        addRing(root, 0.95, 0.48, [0.82, 1.05, 1.6], 0x4cc79f, 0.1);

        const gr = (1 + Math.sqrt(5)) / 2;
        const yAxis = new THREE.Vector3(0, 1, 0);
        const segmentLength = 1;
        const tubeGeometry = new THREE.CylinderGeometry(0.009, 0.009, segmentLength, 8, 1, true);
        const glowGeometry = new THREE.CylinderGeometry(0.026, 0.026, segmentLength, 12, 1, true);
        const markerGeometry = new THREE.SphereGeometry(0.026, 10, 10);
        const n = 116;

        for (let i = 0; i < n; i += 1) {
          const theta = Math.acos(1 - 2 * (i + 0.5) / n);
          const phi = (2 * Math.PI * i) / gr;
          const direction = new THREE.Vector3(
            Math.sin(theta) * Math.cos(phi),
            Math.cos(theta),
            Math.sin(theta) * Math.sin(phi),
          ).normalize();
          const raw = new THREE.Vector3(
            seeded(i * 7 + 1) - 0.5,
            seeded(i * 7 + 2) - 0.5,
            seeded(i * 7 + 3) - 0.5,
          );
          let tangent = raw.sub(direction.clone().multiplyScalar(raw.dot(direction)));
          if (tangent.lengthSq() < 0.001) {
            tangent = new THREE.Vector3(1, 0, 0).cross(direction);
          }
          tangent.normalize();
          const bitangent = new THREE.Vector3().crossVectors(direction, tangent).normalize();
          const parameter = i / n;
          const foldedAnchor = new THREE.Vector3(
            Math.sin(phi * 1.7) * Math.sin(theta) * 0.36,
            Math.cos(theta * 1.15) * 0.28,
            Math.cos(phi * 1.35) * Math.sin(theta) * 0.3,
          );
          const localJitter = tangent
            .clone()
            .multiplyScalar((seeded(i * 7 + 5) - 0.5) * 0.18)
            .add(bitangent.clone().multiplyScalar((seeded(i * 7 + 6) - 0.5) * 0.14));
          const anchor = foldedAnchor
            .add(localJitter)
            .multiplyScalar(0.72 + Math.sin(parameter * Math.PI * 2) * 0.12);
          const center = anchor.clone().add(direction.clone().multiplyScalar(segmentLength * 0.5));
          const highlight = i % 23 === 0;
          const quaternion = new THREE.Quaternion().setFromUnitVectors(yAxis, direction);

          if (highlight) {
            const glow = new THREE.Mesh(glowGeometry, tubeMaterial(0x60a5fa, 0.18));
            glow.position.copy(center);
            glow.quaternion.copy(quaternion);
            root.add(glow);
          }

          const tube = new THREE.Mesh(
            tubeGeometry,
            tubeMaterial(highlight ? 0xf5f5f5 : 0x93c5fd, highlight ? 0.62 : 0.14 + seeded(i * 7 + 7) * 0.16),
          );
          tube.position.copy(center);
          tube.quaternion.copy(quaternion);
          tube.scale.set(highlight ? 1.65 : 1, 1, highlight ? 1.65 : 1);
          root.add(tube);

          if (highlight) {
            const startMarker = new THREE.Mesh(markerGeometry, tubeMaterial(0x60a5fa, 0.72));
            startMarker.position.copy(anchor);
            root.add(startMarker);

            const endMarker = new THREE.Mesh(markerGeometry, tubeMaterial(0xf5f5f5, 0.68));
            endMarker.position.copy(anchor.clone().add(direction.clone().multiplyScalar(segmentLength)));
            root.add(endMarker);
          }
        }
      }

      function render() {
        renderer.render(scene, camera);
      }

      function resize() {
        const rect = shell.getBoundingClientRect();
        renderer.setSize(rect.width, rect.height, false);
        camera.aspect = rect.width / rect.height;
        camera.updateProjectionMatrix();
        buildKakeyaScene();
        render();
      }

      resize();
      window.addEventListener("resize", resize);
      requestAnimationFrame(render);
      window.mathAtlasSocialReady = true;
    </script>
  </body>
</html>
